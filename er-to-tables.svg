<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
 <title id="t">Transformación de un diagrama entidad-relación en tablas</title><desc id="d">Dos entidades, cliente y pedido, conectadas por una relación uno a muchos, se transforman en dos tablas mediante una clave foránea.</desc>
 <defs><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1f305f"/><stop offset="1" stop-color="#405a7e"/></linearGradient><linearGradient id="entity" x2="1"><stop stop-color="#c79a72"/><stop offset="1" stop-color="#a56e54"/></linearGradient></defs>
 <rect x="4" y="4" width="992" height="332" rx="26" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".24" stroke-width="3"/>
 <text x="48" y="49" font-family="Arial" font-size="15" fill="#cbd8e6" font-weight="700" letter-spacing="2">DISEÑO CONCEPTUAL</text><text x="573" y="49" font-family="Arial" font-size="15" fill="#e1c7a7" font-weight="700" letter-spacing="2">DISEÑO RELACIONAL</text>
 <g transform="translate(50 91)"><rect width="190" height="145" rx="16" fill="#fffaf2"/><path d="M0 47h190" stroke="#e8e0dc" stroke-width="2"/><path d="M0 0h190v47H0z" rx="15" fill="url(#entity)"/><text x="95" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#243a63" font-weight="700">ENTIDAD: CLIENTE</text><text x="19" y="78" font-family="Arial" font-size="13" fill="#52647c">id_cliente · clave</text><text x="19" y="105" font-family="Arial" font-size="13" fill="#52647c">nombre</text><text x="19" y="130" font-family="Arial" font-size="13" fill="#52647c">correo</text></g>
 <g transform="translate(292 155)" font-family="Arial" font-size="13" font-weight="700" fill="#b9cce0"><text x="0" y="-17">1</text><text x="89" y="-17">N</text><path d="M12-11h72" stroke="#8299b5" stroke-width="3" stroke-dasharray="6 5"/><text x="48" y="17" text-anchor="middle" fill="#fff">realiza</text></g>
 <g transform="translate(400 91)"><rect width="160" height="145" rx="16" fill="#fffaf2"/><path d="M0 47h160" stroke="#e8e0dc" stroke-width="2"/><path d="M0 0h160v47H0z" fill="#738eae"/><text x="80" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#243a63" font-weight="700">PEDIDO</text><text x="17" y="78" font-family="Arial" font-size="13" fill="#52647c">id_pedido</text><text x="17" y="105" font-family="Arial" font-size="13" fill="#52647c">fecha</text></g>
 <path d="M571 164h82" stroke="#d6b28b" stroke-width="4" stroke-linecap="round"/><path d="m641 152 17 12-17 12" fill="none" stroke="#d6b28b" stroke-width="4"/>
 <g transform="translate(680 82)" font-family="monospace" font-size="14"><rect width="278" height="163" rx="15" fill="#171f36" stroke="#ffffff" stroke-opacity=".2"/><text x="17" y="35" fill="#c5987a">CLIENTE</text><text x="17" y="61" fill="#e2e8f0">id_cliente <tspan fill="#a9c0d7">PK</tspan></text><text x="17" y="85" fill="#e2e8f0">nombre</text><path d="M15 101h247" stroke="#ffffff" stroke-opacity=".2"/><text x="17" y="126" fill="#c5987a">PEDIDO</text><text x="17" y="150" fill="#e2e8f0" font-size="12">id_cliente <tspan fill="#d8b48c">FK</tspan></text></g>
 <text x="500" y="296" text-anchor="middle" font-family="Arial" font-size="14" fill="#d4dbea">PK identifica una fila · FK conecta tablas · una relación N:M necesita una tabla intermedia</text>
